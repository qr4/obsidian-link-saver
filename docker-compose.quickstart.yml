# Try the save service on your own machine: no server, proxy or LiveSync.
# Everything lives in ./playground (git-ignored); open playground/vault as a
# vault in Obsidian to watch saved links appear.
#
#   mkdir -p playground/vault playground/blobs
#   PUID=$(id -u) PGID=$(id -g) docker compose -f docker-compose.quickstart.yml up --build
#
# Then open http://localhost:8765. README, "Quick start", has the details.
name: obsidian-quickstart

services:
  saver:
    build: .
    image: obsidian-saver:latest
    container_name: obsidian-saver-quickstart
    ports:
      - "127.0.0.1:${SAVER_PORT:-8765}:8765"
    # Reaches an Ollama running on this machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      # Or another backend: LLM_PROVIDER=openai|anthropic with LLM_MODEL,
      # LLM_API_KEY (and LLM_URL for a local OpenAI-compatible server).
      # The Settings tab in the web UI changes these too.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b}
      # CPU transcription: a small model keeps it bearable
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WORKERS: "2"
      BLOB_DIR: /blobs
      PUBLIC_URL: http://localhost:${SAVER_PORT:-8765}
      MANAGE_WAYPOINTS: "true"
      VAULT_NAME: vault
    volumes:
      - ./playground/vault:/vault
      - ./playground/blobs:/blobs
      - ./playground/data:/config
