[project]
license = "Unlicense"
name = "obsidian-save-service"
version = "2.0.0"
description = "Web service that saves links into an Obsidian vault: capture, tag, summarize, file into Areas/"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# GPU/CPU transcription. Kept optional so the service still runs (without
# transcripts) where CTranslate2 wheels aren't available.
whisper = ["faster-whisper>=1.1"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
saver = "saver.__main__:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX license string (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saver*"]

[tool.setuptools.package-data]
saver = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
