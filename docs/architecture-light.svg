<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How obsidian-link-saver fits together</title>
<desc id="d">Obsidian on your devices syncs through the LiveSync plugin with CouchDB behind a reverse proxy. The livesync-bridge keeps CouchDB and the vault copy on the server in sync. The saver service, reached through the proxy by the web UI, bookmarklet and obsidian-save client, writes notes into the vault copy, stores videos and git clones in the blob store, fetches content from the web, and asks an LLM to tag, summarize and file each link: Ollama, any OpenAI-compatible server (OpenAI, LM Studio, llama.cpp, vLLM, OpenRouter) or Anthropic, chosen in the web UI. SingleFile in the browser, with its Companion, saves pages into the desktop vault's inbox folder; LiveSync carries them to the vault copy, where the saver watches the inbox and imports them. Claude Code edits the notes in the desktop vault and calls the saver API for the registry, vault lock and folder indexes.</desc>
