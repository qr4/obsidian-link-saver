<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How obsidian-link-saver fits together</title>
<desc id="d">Obsidian on your devices syncs through the LiveSync plugin with CouchDB behind a reverse proxy. The livesync-bridge keeps CouchDB and the vault copy on the server in sync. The saver service, reached through the proxy by the web UI, bookmarklet, obsidian-save client and Claude Code skill, writes notes into the vault copy, stores videos and git clones in the blob store, fetches content from the web, and asks Ollama to tag, summarize and file each link.</desc>
